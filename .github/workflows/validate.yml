name: Validate LGHS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-cryptography
      - name: Shellcheck
        run: |
          shellcheck install.sh student/lghs-enforce student/lghs-check updater/lghs-update updater/lghs-0.5-install
      - name: Python syntax
        run: |
          python3 -m py_compile \
            controller/lghsctl \
            controller/lghs-fleet-api \
            controller/lghs-fleet-command \
            controller/lghs-bt-provision \
            bluetooth/lghs_bt_protocol.py \
            student/lghs-agent \
            student/lghs-command-executor \
            student/lghs-bt-bootstrap \
            student/lghs-legacy-identity-cleanup \
            tests/test_bt_bootstrap.py
      - name: Bluetooth bootstrap tests
        run: python3 -m unittest -v tests/test_bt_bootstrap.py
