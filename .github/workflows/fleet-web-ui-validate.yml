name: Fleet Web UI Validate

on:
  push:
    branches:
      - feature/fleet-web-ui-build
    paths:
      - 'web-ui/**'
      - '.github/workflows/fleet-web-ui-validate.yml'
  pull_request:
    paths:
      - 'web-ui/**'
      - '.github/workflows/fleet-web-ui-validate.yml'

permissions:
  contents: read

concurrency:
  group: fleet-web-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production frontend
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: npm run test:e2e
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-web-ui-playwright-report
          path: |
            web-ui/playwright-report
            web-ui/test-results
          retention-days: 7

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile gateway
        run: python -m py_compile web-ui/gateway/app.py web-ui/gateway/test_security.py
      - name: Validate deployment shell
        run: bash -n web-ui/deploy/install-controller.sh
      - name: Install pinned gateway dependencies
        run: python -m pip install --disable-pip-version-check -r web-ui/gateway/requirements.txt
      - name: Import gateway module
        env:
          LGHS_WEB_DIST: /tmp/lghs-web-ui-not-built
        run: PYTHONPATH=web-ui/gateway python -c "import app; print(app.app.title)"
      - name: Run gateway security tests
        run: PYTHONPATH=web-ui/gateway python web-ui/gateway/test_security.py -v

  package:
    if: github.event_name == 'push'
    needs: [frontend, browser, gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package.json
      - name: Build exact validated commit
        working-directory: web-ui
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Assemble test bundle
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/LGHS-Fleet-Web-Test"
          mkdir -p "$OUT/web-ui"
          rsync -a \
            --exclude node_modules \
            --exclude playwright-report \
            --exclude test-results \
            web-ui/ "$OUT/web-ui/"
          cat > "$OUT/BUILD-METADATA.txt" <<EOF
          LGHS Fleet Web UI pre-release test bundle
          commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          workflow_run=${GITHUB_RUN_ID}
          built_utc=$(date -u +%FT%TZ)
          validation=frontend+browser+gateway-security
          EOF
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
      - name: Upload validated test bundle
        uses: actions/upload-artifact@v4
        with:
          name: LGHS-Fleet-Web-Test-${{ github.sha }}
          path: ${{ runner.temp }}/LGHS-Fleet-Web-Test
          retention-days: 14
          compression-level: 6
