name: Fleet Web UI Validate

on:
  push:
    branches:
      - feature/fleet-web-ui-build
    paths:
      - 'web-ui/**'
      - '.github/workflows/fleet-web-ui-validate.yml'
  pull_request:
    paths:
      - 'web-ui/**'
      - '.github/workflows/fleet-web-ui-validate.yml'

permissions:
  contents: read

concurrency:
  group: fleet-web-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-ui/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build production frontend
        run: npm run build

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile gateway
        run: python -m py_compile web-ui/gateway/app.py
      - name: Install pinned gateway dependencies
        run: python -m pip install --disable-pip-version-check -r web-ui/gateway/requirements.txt
      - name: Import gateway module
        env:
          LGHS_WEB_DIST: /tmp/lghs-web-ui-not-built
        run: PYTHONPATH=web-ui/gateway python -c "import app; print(app.app.title)"
