name: Bluetooth Zero-Touch Validate

on:
  push:
    branches:
      - feature/bt-zero-touch-hardening
  pull_request:
    paths:
      - 'bluetooth/**'
      - 'student/lghs-bt-*'
      - 'student/lghs-cloudflare-install'
      - 'student/lghs-firstboot-provision'
      - 'controller/lghs-bt-provision'
      - 'controller/lghs-cloudflare-provision'
      - 'controller/lghs-cloudflare-token-check'
      - 'systemd/lghs-bt-*'
      - 'systemd/lghs-firstboot-provision.service'
      - 'tests/test_bt_bootstrap.py'
      - '.github/workflows/bt-zero-touch-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install protocol dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=45,<47'
      - name: Compile Python bootstrap components
        run: |
          python -m py_compile \
            bluetooth/lghs_bt_protocol.py \
            student/lghs-bt-bootstrap \
            controller/lghs-bt-provision \
            controller/lghs-cloudflare-provision \
            controller/lghs-cloudflare-token-check
      - name: Validate shell bootstrap components
        run: |
          bash -n student/lghs-cloudflare-install
          bash -n student/lghs-firstboot-provision
          bash -n bluetooth/install-live-test.sh
      - name: Run Bluetooth protocol and lifecycle tests
        run: python -m unittest -v tests.test_bt_bootstrap

  package:
    if: github.event_name == 'push'
    needs: [validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Assemble hardware test kit
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/LGHS-Bluetooth-Zero-Touch-Test"
          mkdir -p \
            "$OUT/bluetooth" \
            "$OUT/student" \
            "$OUT/controller" \
            "$OUT/systemd" \
            "$OUT/tests"
          cp bluetooth/lghs_bt_protocol.py bluetooth/HARDWARE-TESTING.md bluetooth/install-live-test.sh "$OUT/bluetooth/"
          cp student/lghs-bt-bootstrap student/lghs-cloudflare-install student/lghs-firstboot-provision "$OUT/student/"
          cp controller/lghs-bt-provision controller/lghs-cloudflare-provision controller/lghs-cloudflare-token-check "$OUT/controller/"
          cp systemd/lghs-bt-bootstrap.service systemd/lghs-bt-prepare.service systemd/lghs-bt-provision.service systemd/lghs-firstboot-provision.service "$OUT/systemd/"
          cp tests/test_bt_bootstrap.py "$OUT/tests/"
          cat > "$OUT/BUILD-METADATA.txt" <<EOF
          LGHS Bluetooth zero-touch pre-release hardware test kit
          commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          workflow_run=${GITHUB_RUN_ID}
          built_utc=$(date -u +%FT%TZ)
          validation=crypto+python-compile+shell-syntax+lifecycle-invariants
          authorized_hardware=LGCSCONT+CS-999
          tomorrow_first_fresh_flash=CS-01
          EOF
          find "$OUT" -type f -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.txt"
      - name: Upload validated Bluetooth test kit
        uses: actions/upload-artifact@v4
        with:
          name: LGHS-Bluetooth-Zero-Touch-Test-${{ github.sha }}
          path: ${{ runner.temp }}/LGHS-Bluetooth-Zero-Touch-Test
          retention-days: 14
          compression-level: 6
