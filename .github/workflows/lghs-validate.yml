name: LGHS Validate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile \
            controller/lghs/__init__.py \
            controller/lghs/protocol.py \
            controller/lghs/database.py \
            controller/lghs-db-migrate \
            controller/lghs-console \
            controller/lghs-console-responsive \
            controller/lghs-console-day2 \
            controller/lghs-fleet-api \
            controller/lghs-fleet-command \
            controller/lghs-fleet-notify \
            controller/lghsctl \
            controller/lghs-audit-sync \
            updater/lghs-netqueue \
            student/lghs-agent \
            student/lghs-command-executor \
            student/lghs-telemetry-push \
            student/lghs-sudo-broker \
            student/lghs-approved-exec \
            student/lghs-sudo-admin \
            student/lghs-audit-export \
            student/sudo \
            tests/test_command_plane.py \
            tests/test_fleet_database.py

      - name: Command-plane regression tests
        run: python3 -m unittest -v tests/test_command_plane.py

      - name: Fleet database and protocol tests
        run: python3 -m unittest -v tests/test_fleet_database.py

      - name: Shell syntax
        run: |
          for file in \
            install.sh \
            updater/lghs-update \
            updater/lghs-0.5-install \
            updater/lghs-os-update \
            updater/lghs-autologin-apply \
            updater/lghs-reconcile \
            updater/lghs-access-enforce \
            updater/lghs-install-success-notify \
            controller/lghsctl-wrapper \
            systemd/90-lghs-netqueue \
            student/lghs-enforce \
            student/lghs-check \
            student/lghs-report \
            student/lghs-firstboot-provision \
            student/lghs-install-network-ui \
            student/lghs-network-ui-apply \
            student/lghs-dev-setup \
            image-builder/build-image.sh \
            image-builder/stage-lghs/prerun.sh \
            image-builder/stage-lghs/00-install-lghs/00-run.sh
          do
            bash -n "$file"
          done

      - name: Sudoers syntax
        run: |
          sudo visudo -cf policies/sudoers/89-lghs-audit
          sudo visudo -cf policies/sudoers/90-lghs-student
          sudo visudo -cf policies/sudoers/99-lghs-admin

      - name: Legacy telemetry rollback invariants
        run: |
          grep -q '^ProtectSystem=strict$' systemd/lghs-telemetry-push.service
          grep -q '^StateDirectory=lghs/telemetry$' systemd/lghs-telemetry-push.service
          grep -q '/var/lib/lghs/telemetry/command-state.json' student/lghs-telemetry-push

      - name: Fleet API SQLite invariants
        run: |
          grep -q '^ProtectSystem=strict$' systemd/lghs-fleet-api.service
          grep -q "database':'sqlite-wal" controller/lghs-fleet-api
          grep -q '/v1/commands/' controller/lghs-fleet-api
          grep -q 'commands_for_delivery' controller/lghs-fleet-api
          grep -q 'FleetDB' controller/lghs-fleet-command
          grep -q 'migrate_legacy' controller/lghs-db-migrate

      - name: Managed agent security invariants
        run: |
          grep -q '^User=lghs-agent$' systemd/lghs-agent.service
          grep -q '^NoNewPrivileges=yes$' systemd/lghs-agent.service
          grep -q '^ProtectSystem=strict$' systemd/lghs-agent.service
          grep -q '^User=root$' systemd/lghs-command-executor.service
          grep -q '^NoNewPrivileges=yes$' systemd/lghs-command-executor.service
          grep -q "ACTIONS={'lghs-update'" student/lghs-command-executor
          if grep -qE 'shell=True|/bin/(ba)?sh|eval\(' student/lghs-command-executor; then
            echo 'Privileged executor contains an arbitrary shell path.' >&2
            exit 1
          fi
          grep -q 'systemctl disable --now lghs-telemetry-push.service' updater/lghs-0.5-install
          grep -q 'lghs-command-executor.service lghs-agent.service' updater/lghs-0.5-install

      - name: SQLite foundation invariants
        run: |
          grep -q "journal_mode=WAL" controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS commands' controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS command_events' controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS warnings' controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS deployments' controller/lghs/database.py
          grep -q 'PROTOCOL_VERSION = 1' controller/lghs/protocol.py
          grep -q 'evaluate_health' controller/lghs/database.py
          grep -q 'min_redelivery' controller/lghs/database.py

      - name: Update integration invariants
        run: |
          grep -q './updater/lghs-0.5-install "$ROLE"' updater/lghs-update
          grep -q 'validate_student_05' updater/lghs-update
          grep -q '/var/lib/lghs/fleet.db' updater/lghs-update
          grep -q 'lghs-agent/fleet-api.conf' updater/lghs-0.5-install

      - name: Release invariants
        run: |
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
          grep -q '^0\.5\.0$' VERSION
          grep -q 'controller/lghs-console-responsive.*lghs-console-responsive-core' install.sh
          grep -q 'controller/lghs-console-day2.*lghs-console' install.sh
          grep -q 'controller/lghs-fleet-command.*lghs-fleet-command' install.sh
          grep -q 'MEMORY_GB="$(read_value MEMORY_GB' student/lghs-firstboot-provision
          grep -q '"$MEMORY_GB" == "4" || "$MEMORY_GB" == "8"' student/lghs-firstboot-provision

      - name: Fleet transport security invariants
        run: |
          grep -q 'https://github.com/caden4314/LGHS-System.git' updater/lghs-update
          grep -q 'StrictHostKeyChecking=yes' controller/lghsctl
          grep -q 'PasswordAuthentication=no' controller/lghsctl
          grep -q 'KbdInteractiveAuthentication=no' controller/lghsctl
          grep -q 'ForwardAgent=no' controller/lghsctl
          grep -q 'ForwardX11=no' controller/lghsctl
          grep -q 'ClearAllForwardings=yes' controller/lghsctl
          if grep -R -n 'StrictHostKeyChecking=no' controller updater student; then
            echo 'Unsafe SSH host-key checking found.' >&2
            exit 1
          fi
