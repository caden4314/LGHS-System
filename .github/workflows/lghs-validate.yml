name: LGHS Validate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile \
            controller/lghs-console \
            controller/lghs-console-responsive \
            controller/lghs-console-day2 \
            controller/lghs-fleet-api \
            controller/lghs-fleet-command \
            controller/lghs-fleet-notify \
            controller/lghsctl \
            controller/lghs-audit-sync \
            updater/lghs-netqueue \
            student/lghs-telemetry-push \
            student/lghs-sudo-broker \
            student/lghs-approved-exec \
            student/lghs-sudo-admin \
            student/lghs-audit-export \
            student/sudo

      - name: Shell syntax
        run: |
          for file in \
            install.sh \
            updater/lghs-update \
            updater/lghs-os-update \
            updater/lghs-autologin-apply \
            updater/lghs-reconcile \
            updater/lghs-access-enforce \
            updater/lghs-install-success-notify \
            controller/lghsctl-wrapper \
            systemd/90-lghs-netqueue \
            student/lghs-enforce \
            student/lghs-check \
            student/lghs-agent \
            student/lghs-report \
            student/lghs-firstboot-provision \
            student/lghs-install-network-ui \
            student/lghs-network-ui-apply \
            student/lghs-dev-setup \
            image-builder/build-image.sh \
            image-builder/stage-lghs/prerun.sh \
            image-builder/stage-lghs/00-install-lghs/00-run.sh
          do
            bash -n "$file"
          done

      - name: Sudoers syntax
        run: |
          sudo visudo -cf policies/sudoers/89-lghs-audit
          sudo visudo -cf policies/sudoers/90-lghs-student
          sudo visudo -cf policies/sudoers/99-lghs-admin

      - name: Release invariants
        run: |
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
          grep -q 'controller/lghs-console-responsive' install.sh
          grep -q 'lghs-fleet-notify.service' install.sh
          grep -q 'lghs-install-success-notify.service' install.sh
          grep -q 'MEMORY_GB="$(read_value MEMORY_GB' student/lghs-firstboot-provision
          grep -q '"$MEMORY_GB" == "4" || "$MEMORY_GB" == "8"' student/lghs-firstboot-provision
          grep -q 'Visual Studio Code.desktop' student/lghs-dev-setup
          grep -q 'lghs-console-day2' student/lghs-dev-setup
          grep -q 'metadata::trusted true' student/lghs-dev-setup
          grep -q 'find_code_icon' student/lghs-dev-setup
          grep -q 'wfpanelctl notify' updater/lghs-install-success-notify
          grep -q 'wfpanelctl' controller/lghs-fleet-notify
          test -f systemd/lghs-update.timer
          test -f systemd/lghs-reconcile.timer
          test -f systemd/lghs-netqueue.timer
          test -f systemd/lghs-install-success-notify.service

      - name: Fleet transport security invariants
        run: |
          grep -q 'https://github.com/caden4314/LGHS-System.git' updater/lghs-update
          grep -q 'StrictHostKeyChecking=yes' controller/lghsctl
          grep -q 'PasswordAuthentication=no' controller/lghsctl
          grep -q 'KbdInteractiveAuthentication=no' controller/lghsctl
          grep -q 'ForwardAgent=no' controller/lghsctl
          grep -q 'ForwardX11=no' controller/lghsctl
          grep -q 'ClearAllForwardings=yes' controller/lghsctl
          grep -q 'Match User cs_admin' install.sh
          grep -q 'PubkeyAuthentication yes' install.sh
          grep -q 'AllowAgentForwarding no' install.sh
          grep -q 'AllowTcpForwarding no' install.sh
          grep -q 'PermitTunnel no' install.sh
          grep -q 'GatewayPorts no' install.sh
          if grep -R -n 'StrictHostKeyChecking=no' controller updater student; then
            echo 'Unsafe SSH host-key checking found.' >&2
            exit 1
          fi
