name: LGHS Validate

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bluetooth crypto dependency
        run: sudo apt-get update && sudo apt-get install -y python3-cryptography

      - name: Python syntax
        run: |
          python3 -m py_compile \
            controller/lghs/__init__.py \
            controller/lghs/protocol.py \
            controller/lghs/database.py \
            controller/lghs/audit.py \
            controller/lghs/sudo_state.py \
            controller/lghs-db-migrate \
            controller/lghs-fleet-state \
            controller/lghs-console \
            controller/lghs-console-responsive \
            controller/lghs-console-day2 \
            controller/lghs-fleet-api \
            controller/lghs-fleet-command \
            controller/lghs-fleet-notify \
            controller/lghsctl \
            controller/lghs-audit-sync \
            controller/lghs-remote-admin \
            controller/lghs-remote-shell \
            controller/lghs-bt-provision \
            bluetooth/lghs_bt_protocol.py \
            updater/lghs-netqueue \
            student/lghs-agent \
            student/lghs-command-executor \
            student/lghs-bt-bootstrap \
            student/lghs-legacy-identity-cleanup \
            student/lghs-telemetry-push \
            student/lghs-sudo-broker \
            student/lghs-approved-exec \
            student/lghs-sudo-admin \
            student/lghs-sudo-selftest \
            student/lghs-audit-export \
            student/sudo \
            tests/test_command_plane.py \
            tests/test_fleet_database.py \
            tests/test_audit_ingest.py \
            tests/test_sudo_state.py \
            tests/test_fleet_api_integration.py \
            tests/test_bt_bootstrap.py

      - name: Runtime-independent unit and integration tests
        run: |
          python3 -m unittest -v \
            tests/test_command_plane.py \
            tests/test_fleet_database.py \
            tests/test_audit_ingest.py \
            tests/test_sudo_state.py \
            tests/test_fleet_api_integration.py \
            tests/test_bt_bootstrap.py

      - name: Shell syntax
        run: |
          for file in \
            install.sh \
            updater/lghs-update \
            updater/lghs-0.5-install \
            updater/lghs-os-update \
            updater/lghs-autologin-apply \
            updater/lghs-reconcile \
            updater/lghs-access-enforce \
            updater/lghs-install-success-notify \
            controller/lghsctl-wrapper \
            controller/install-remote-admin \
            bluetooth/lghs-bt-prepare \
            systemd/90-lghs-netqueue \
            student/lghs-discovery-advertise \
            student/lghs-enforce \
            student/lghs-check \
            student/lghs-report \
            student/lghs-firstboot-provision \
            student/lghs-install-network-ui \
            student/lghs-network-ui-apply \
            student/lghs-dev-setup \
            image-builder/build-image.sh \
            image-builder/stage-lghs/prerun.sh \
            image-builder/stage-lghs/00-install-lghs/00-run.sh
          do
            bash -n "$file"
          done

      - name: Sudoers syntax
        run: |
          sudo visudo -cf policies/sudoers/89-lghs-audit
          sudo visudo -cf policies/sudoers/90-lghs-student
          sudo visudo -cf policies/sudoers/98-lghs-remote
          sudo visudo -cf policies/sudoers/99-lghs-admin

      - name: Remote administration invariants
        run: |
          grep -q 'ForceCommand /usr/local/sbin/lghs-remote-shell' controller/install-remote-admin
          grep -q 'AuthorizedKeysFile /etc/ssh/authorized_keys/lghs_remote' controller/install-remote-admin
          grep -q 'AuthenticationMethods publickey' controller/install-remote-admin
          grep -q 'no-port-forwarding' controller/lghs-remote-admin
          grep -q 'sudo-approve' controller/lghs-remote-shell
          grep -q 'lghs-sudo-selftest' install.sh
          grep -q 'lghs-legacy-identity-cleanup --remove-safe' install.sh
          grep -q "LEGACY_ADMIN = 'cs' + '_admin'" student/lghs-legacy-identity-cleanup
          grep -q "LEGACY_STUDENT = 'lg' + '_cs' + '_cont'" student/lghs-legacy-identity-cleanup
          grep -q 'owned_outside_home' student/lghs-legacy-identity-cleanup
          grep -q 'supplementary_groups' student/lghs-legacy-identity-cleanup
          grep -q '/bin/bash ./install.sh "$ROLE" || return 1' updater/lghs-update
          grep -q '/usr/local/sbin/lghs-check || return 1' updater/lghs-update
          grep -q 'validate_student_05 || return 1' updater/lghs-update
          grep -q 'validate_controller || return 1' updater/lghs-update
          grep -q "journalctl --no-pager -n 220 -u lghs-update.service" student/lghs-report

      - name: Legacy telemetry rollback invariants
        run: |
          grep -q '^ProtectSystem=strict$' systemd/lghs-telemetry-push.service
          grep -q '^StateDirectory=lghs/telemetry$' systemd/lghs-telemetry-push.service
          grep -q '/var/lib/lghs/telemetry/command-state.json' student/lghs-telemetry-push

      - name: Fleet API SQLite invariants
        run: |
          grep -q '^ProtectSystem=strict$' systemd/lghs-fleet-api.service
          grep -q "database':'sqlite-wal" controller/lghs-fleet-api
          grep -q '/v1/commands/' controller/lghs-fleet-api
          grep -q 'commands_for_delivery' controller/lghs-fleet-api
          grep -q 'record_batches' controller/lghs-fleet-api
          grep -q 'audit_ack' controller/lghs-fleet-api
          grep -q 'record_snapshot' controller/lghs-fleet-api
          grep -q "sudo_transport':'https-events" controller/lghs-fleet-api
          grep -q 'FleetDB' controller/lghs-fleet-command
          grep -q 'migrate_legacy' controller/lghs-db-migrate

      - name: Managed agent security invariants
        run: |
          grep -q '^User=lghs-agent$' systemd/lghs-agent.service
          grep -q '^NoNewPrivileges=yes$' systemd/lghs-agent.service
          grep -q '^ProtectSystem=strict$' systemd/lghs-agent.service
          grep -q '^User=root$' systemd/lghs-command-executor.service
          grep -q '^NoNewPrivileges=yes$' systemd/lghs-command-executor.service
          grep -q "'lghs-update': \[NETQUEUE" student/lghs-command-executor
          grep -q "'os-update': \[NETQUEUE" student/lghs-command-executor
          grep -q 'def sudo_snapshot' student/lghs-command-executor
          grep -q "op == 'sudo'" student/lghs-command-executor
          grep -q 'def sudo_event_watcher' student/lghs-agent
          grep -q "'sudo_requests': status.get" student/lghs-agent
          grep -q 'audit_batches' student/lghs-agent
          if grep -qE 'shell=True|/bin/(ba)?sh|eval\(' student/lghs-command-executor; then
            echo 'Privileged executor contains an arbitrary shell path.' >&2
            exit 1
          fi
          grep -q 'systemctl disable --now lghs-telemetry-push.service' install.sh
          grep -q 'lghs-command-executor.service lghs-agent.service' install.sh
          grep -q 'purpose=bootstrap-recovery' student/lghs-discovery-advertise

      - name: Bluetooth bootstrap security invariants
        run: |
          grep -q 'X25519PrivateKey' bluetooth/lghs_bt_protocol.py
          grep -q 'AESGCM' bluetooth/lghs_bt_protocol.py
          grep -q 'HKDF' bluetooth/lghs_bt_protocol.py
          grep -q 'fleet-api-tokens.json' controller/lghs-bt-provision
          grep -q 'verify_proof(token, "student"' controller/lghs-bt-provision
          grep -q 'verify_proof(token, "controller"' student/lghs-bt-bootstrap
          grep -q 'btmgmt_command("find", "-b")' student/lghs-bt-bootstrap
          grep -q '\["script", "-q", "-e", "-c", shlex.join(base), "/dev/null"\]' student/lghs-bt-bootstrap
          grep -q 'local cmd=(/usr/bin/btmgmt -i "$BT_INDEX" "$@")' bluetooth/lghs-bt-prepare
          grep -q 'retry_btmgmt "NoInputNoOutput IO capability" io-cap 3' bluetooth/lghs-bt-prepare
          grep -q 'retry_btmgmt "pairable mode" pairable on' bluetooth/lghs-bt-prepare
          grep -q '/usr/bin/script -q -e -c "$quoted" /dev/null' bluetooth/lghs-bt-prepare
          grep -q 'Before=lghs-bt-provision.service lghs-bt-bootstrap.service' systemd/lghs-bt-prepare.service
          grep -q 'bluetoothd --compat' install.sh
          grep -q 'ConditionPathExists=/etc/lghs/bluetooth-bootstrap-enabled' systemd/lghs-bt-bootstrap.service
          grep -q 'ConditionPathExists=!/var/lib/lghs/bootstrap/wifi-provisioned.json' systemd/lghs-bt-bootstrap.service
          grep -q '^ProtectSystem=strict$' systemd/lghs-bt-provision.service
          grep -q '^ProtectSystem=strict$' systemd/lghs-bt-bootstrap.service
          if grep -R -nE 'LGHS_WIFI_PASSWORD=|DEFAULT_PSK=' bluetooth controller/lghs-bt-provision student/lghs-bt-bootstrap; then
            echo 'Static Bluetooth provisioning Wi-Fi secret found.' >&2
            exit 1
          fi

      - name: SQLite foundation invariants
        run: |
          grep -q 'journal_mode=WAL' controller/lghs/database.py
          grep -q 'SCHEMA_VERSION = 3' controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS device_tags' controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS fleet_groups' controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS group_members' controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS commands' controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS command_events' controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS warnings' controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS deployments' controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS audit_events' controller/lghs/database.py
          grep -q 'CREATE TABLE IF NOT EXISTS sudo_requests' controller/lghs/database.py
          grep -q 'PROTOCOL_VERSION = 1' controller/lghs/protocol.py
          grep -q 'evaluate_health' controller/lghs/database.py
          grep -q 'min_redelivery' controller/lghs/database.py
          grep -q 'target_commit must be an exact 40-character Git commit SHA' controller/lghs/database.py

      - name: Canonical installer invariants
        run: |
          grep -q 'groupadd --system lghs-agent' install.sh
          grep -q 'useradd --system --gid lghs-agent' install.sh
          grep -q 'controller/lghs/database.py' install.sh
          grep -q 'controller/lghs/audit.py' install.sh
          grep -q 'lghs-db-migrate' install.sh
          grep -q 'student/lghs-command-executor' install.sh
          grep -q 'lghs-discovery-advertise.service' install.sh
          grep -q '/var/lib/lghs-agent/fleet-api-token' install.sh
          grep -q '/var/lib/lghs-agent/fleet-api.conf' install.sh
          grep -q 'lghs-bt-provision.service' install.sh
          grep -q 'lghs-bt-bootstrap.service' install.sh
          grep -q 'lghs-bt-prepare.service' install.sh
          grep -q 'python3-cryptography' install.sh
          grep -q 'controller/lghs/sudo_state.py' updater/lghs-0.5-install

      - name: Update integration invariants
        run: |
          grep -q './updater/lghs-0.5-install "$ROLE"' updater/lghs-update
          grep -q 'validate_student_05' updater/lghs-update
          grep -q '/var/lib/lghs/fleet.db' updater/lghs-update
          grep -q 'lghs-agent/fleet-api.conf' updater/lghs-0.5-install
          grep -q 'lghs-bt-provision.service' updater/lghs-0.5-install
          grep -q 'lghs-bt-bootstrap.service' updater/lghs-0.5-install
          grep -q 'lghs-bt-prepare.service' updater/lghs-0.5-install
          grep -q 'systemctl reset-failed lghs-bt-prepare.service lghs-bt-provision.service' updater/lghs-0.5-install
          grep -q 'LGHS_AUDIT_SSH_RECOVERY' controller/lghs-audit-sync

      - name: Release invariants
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
          else
            grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-dev)?$' VERSION
          fi
          grep -Eq '^0\.6\.0(-dev)?$' VERSION
          grep -q 'controller/lghs-console-responsive.*lghs-console-responsive-core' install.sh
          grep -q 'controller/lghs-console-day2.*lghs-console' install.sh
          grep -q 'controller/lghs-fleet-command.*lghs-fleet-command' install.sh
          grep -q 'MEMORY_GB="$(read_value MEMORY_GB' student/lghs-firstboot-provision
          grep -q '"$MEMORY_GB" == "4" || "$MEMORY_GB" == "8"' student/lghs-firstboot-provision

      - name: Fleet transport security invariants
        run: |
          grep -q 'https://github.com/caden4314/LGHS-System.git' updater/lghs-update
          grep -q 'StrictHostKeyChecking=yes' controller/lghsctl
          grep -q 'PasswordAuthentication=no' controller/lghsctl
          grep -q 'KbdInteractiveAuthentication=no' controller/lghsctl
          grep -q 'ForwardAgent=no' controller/lghsctl
          grep -q 'ForwardX11=no' controller/lghsctl
          grep -q 'ClearAllForwardings=yes' controller/lghsctl
          if grep -R -n 'StrictHostKeyChecking=no' controller updater student; then
            echo 'Unsafe SSH host-key checking found.' >&2
            exit 1
          fi
