name: LGHS 0.6 Rollout Validate

on:
  pull_request:
  workflow_dispatch:

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile \
            controller/lghs/health.py \
            controller/lghs/fleet_ui.py \
            controller/lghs/rollout.py \
            controller/lghs/rollout_manager.py \
            controller/lghs/recovery.py \
            controller/lghs/maintenance.py \
            controller/lghs-fleet-rollout \
            controller/lghs-fleet-maintenance \
            controller/lghs-rollout-manager \
            controller/lghs-console-day2 \
            controller/lghs-console-day3 \
            controller/lghs-console-day4 \
            controller/lghs-console-day5 \
            student/lghs-agent \
            student/lghs-command-executor \
            tests/test_fleet_rollout.py \
            tests/test_rollout_manager.py \
            tests/test_deployment_recovery.py \
            tests/test_fleet_api_recovery.py \
            tests/test_fleet_api_maintenance.py \
            tests/test_fleet_api_structured_health.py \
            tests/test_maintenance.py \
            tests/test_reboot_cancel_semantics.py \
            tests/test_structured_health_gate.py \
            tests/test_fleet_ui.py

      - name: Frozen target, recovery, maintenance, reboot, health, UI, and API tests
        run: |
          python3 -m unittest -v \
            tests/test_fleet_rollout.py \
            tests/test_rollout_manager.py \
            tests/test_deployment_recovery.py \
            tests/test_fleet_api_recovery.py \
            tests/test_fleet_api_maintenance.py \
            tests/test_fleet_api_structured_health.py \
            tests/test_maintenance.py \
            tests/test_reboot_cancel_semantics.py \
            tests/test_structured_health_gate.py \
            tests/test_fleet_ui.py

      - name: Security and Fleet Control invariants
        run: |
          set -euxo pipefail
          grep -Fq "target selector matched no enrolled devices" controller/lghs/rollout.py
          grep -Fq "resolved_devices" controller/lghs/rollout.py
          grep -Fq "canary failure" controller/lghs/rollout.py
          grep -Fq "failure threshold exceeded" controller/lghs/rollout.py
          grep -Fq "target_commit" controller/lghs/rollout.py
          grep -Fq "health_details" controller/lghs/rollout.py
          grep -Fq "structured health verified" controller/lghs/rollout.py
          grep -Fq "DEFAULT_REQUIRED_CHECKS" controller/lghs/health.py
          grep -Fq "telemetry.freshness" controller/lghs/health.py
          grep -Fq "storage.root-writable" controller/lghs/health.py
          grep -Fq "transport.controller" controller/lghs/health.py
          grep -Fq "target commit must be an exact 40-character Git SHA" controller/lghs/fleet_ui.py
          grep -Fq "shlex.split" controller/lghs/fleet_ui.py
          grep -Fq "respect_maintenance" controller/lghs/fleet_ui.py
          grep -Fq "health_version': 2" student/lghs-agent
          grep -Fq "failed_systemd_units" student/lghs-agent
          grep -Fq "root_readonly" student/lghs-agent
          grep -Fq "power.undervoltage-history" student/lghs-agent
          grep -Fq "controller_last_success_at" student/lghs-agent
          grep -Fq "rollout-runtime:" controller/lghs/rollout_manager.py
          grep -Fq "gate-transition" controller/lghs/rollout_manager.py
          grep -Fq "soak-started" controller/lghs/rollout_manager.py
          grep -Fq "respect_maintenance" controller/lghs/rollout_manager.py
          grep -Fq "maintenance-wait" controller/lghs/rollout_manager.py
          grep -Fq "retry-failed" controller/lghs/recovery.py
          grep -Fq "current-commit-does-not-match-deployment-target" controller/lghs/recovery.py
          grep -Fq "reboot-schedule:" controller/lghs/maintenance.py
          grep -Fq "CANCELABLE_COMMAND_STATES = frozenset({'queued'})" controller/lghs/maintenance.py
          grep -Fq "reboot-execution" controller/lghs/maintenance.py
          grep -Fq "boot_id_before" controller/lghs/maintenance.py
          grep -Fq "Waiting for current boot_id before dispatch" controller/lghs/maintenance.py
          grep -Fq "Reboot verified by boot_id change" controller/lghs/maintenance.py
          grep -Fq '"reboot"' controller/lghs/protocol.py
          grep -Fq "systemd-run" student/lghs-command-executor
          grep -Fq "deployment_recovery_controls" controller/lghs-fleet-api
          grep -Fq "maintenance_windows" controller/lghs-fleet-api
          grep -Fq "scheduled_reboots" controller/lghs-fleet-api
          grep -Fq "'health_schema':2" controller/lghs-fleet-api
          grep -Fq "'structured_health_gates':True" controller/lghs-fleet-api
          grep -Fq "'deployment_wave_audit':True" controller/lghs-fleet-api
          grep -Fq "Deployments / Updates" controller/lghs-console-day2
          grep -Fq "L Rollback" controller/lghs-console-day2
          grep -Fq 'ord("l"), ord("L")' controller/lghs-console-day2
          if grep -Fq "B Rollback" controller/lghs-console-day2; then
            echo 'Fleet Control rollback hotkey conflicts with the global Back key.' >&2
            exit 1
          fi
          grep -Fq "Rollback is planned only; it is never auto-dispatched from Fleet Control" controller/lghs-console-day2
          grep -Fq "Maintenance / Reboots" controller/lghs-console-day3
          grep -Fq "boot_id verified" controller/lghs-console-day3
          grep -Fq "A reboot already accepted locally may continue" controller/lghs-console-day3
          grep -Fq "lghs-console-day2-core" controller/lghs-console-day3
          grep -Fq "POST-UPDATE HEALTH GATE" controller/lghs-console-day4
          grep -Fq "blocked_checks" controller/lghs-console-day4
          grep -Fq "lghs-console-day3-core" controller/lghs-console-day4
          grep -Fq "Exact immutable target commit (40-char Git SHA)" controller/lghs-console-day5
          grep -Fq "deployment_filter" controller/lghs-console-day5
          grep -Fq "state:paused device:CS-999" controller/lghs-console-day5
          grep -Fq "lghs-console-day4-core" controller/lghs-console-day5
          grep -Fq "ReadWritePaths=/var/lib/lghs /run/lock" systemd/lghs-rollout-manager.service
          grep -Fq 'controller/lghs/sudo_state.py' install.sh
          grep -Fq 'controller/lghs/health.py' install.sh
          grep -Fq 'controller/lghs/fleet_ui.py' install.sh
          grep -Fq 'controller/lghs/recovery.py' install.sh
          grep -Fq 'controller/lghs/maintenance.py' install.sh
          grep -Fq 'controller/lghs-fleet-maintenance' install.sh
          grep -Eq 'controller/lghs-console-day2.*lghs-console-day2-core' install.sh
          grep -Eq 'controller/lghs-console-day3.*lghs-console-day3-core' install.sh
          grep -Eq 'controller/lghs-console-day4.*lghs-console-day4-core' install.sh
          grep -Eq 'controller/lghs-console-day5.*lghs-console' install.sh
          grep -Fq 'controller/lghs/health.py' updater/lghs-0.5-install
          grep -Fq 'controller/lghs/fleet_ui.py' updater/lghs-0.5-install
          grep -Fq 'controller/lghs/recovery.py' updater/lghs-0.5-install
          grep -Fq 'controller/lghs/maintenance.py' updater/lghs-0.5-install
          grep -Fq 'controller/lghs-fleet-maintenance' updater/lghs-0.5-install
          grep -Eq 'controller/lghs-console-day2.*lghs-console-day2-core' updater/lghs-0.5-install
          grep -Eq 'controller/lghs-console-day3.*lghs-console-day3-core' updater/lghs-0.5-install
          grep -Eq 'controller/lghs-console-day4.*lghs-console-day4-core' updater/lghs-0.5-install
          grep -Eq 'controller/lghs-console-day5.*lghs-console' updater/lghs-0.5-install
          if grep -nE 'shell=True|eval\(' controller/lghs/health.py controller/lghs/fleet_ui.py controller/lghs/rollout.py controller/lghs/rollout_manager.py controller/lghs/recovery.py controller/lghs/maintenance.py controller/lghs-fleet-rollout controller/lghs-fleet-maintenance controller/lghs-rollout-manager controller/lghs-console-day3 controller/lghs-console-day4 controller/lghs-console-day5 student/lghs-agent student/lghs-command-executor; then
            echo 'Fleet operations contains an arbitrary shell path.' >&2
            exit 1
          fi
