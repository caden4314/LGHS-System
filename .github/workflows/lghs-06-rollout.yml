name: LGHS 0.6 Rollout Validate

on:
  pull_request:
  workflow_dispatch:

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile \
            controller/lghs/rollout.py \
            controller/lghs/rollout_manager.py \
            controller/lghs/recovery.py \
            controller/lghs/maintenance.py \
            controller/lghs-fleet-rollout \
            controller/lghs-fleet-maintenance \
            controller/lghs-rollout-manager \
            controller/lghs-console-day2 \
            student/lghs-command-executor \
            tests/test_fleet_rollout.py \
            tests/test_rollout_manager.py \
            tests/test_deployment_recovery.py \
            tests/test_fleet_api_recovery.py \
            tests/test_fleet_api_maintenance.py \
            tests/test_maintenance.py

      - name: Frozen target, recovery, maintenance, reboot, and API tests
        run: |
          python3 -m unittest -v \
            tests/test_fleet_rollout.py \
            tests/test_rollout_manager.py \
            tests/test_deployment_recovery.py \
            tests/test_fleet_api_recovery.py \
            tests/test_fleet_api_maintenance.py \
            tests/test_maintenance.py

      - name: Security and Fleet Control invariants
        run: |
          grep -q "target selector matched no enrolled devices" controller/lghs/rollout.py
          grep -q "resolved_devices" controller/lghs/rollout.py
          grep -q "canary failure" controller/lghs/rollout.py
          grep -q "failure threshold exceeded" controller/lghs/rollout.py
          grep -q "target_commit" controller/lghs/rollout.py
          grep -q "rollout-runtime:" controller/lghs/rollout_manager.py
          grep -q "respect_maintenance" controller/lghs/rollout_manager.py
          grep -q "maintenance-wait" controller/lghs/rollout_manager.py
          grep -q "retry-failed" controller/lghs/recovery.py
          grep -q "current-commit-does-not-match-deployment-target" controller/lghs/recovery.py
          grep -q "reboot-schedule:" controller/lghs/maintenance.py
          grep -q "boot_id_before" controller/lghs/maintenance.py
          grep -q "Waiting for current boot_id before dispatch" controller/lghs/maintenance.py
          grep -q "Reboot verified by boot_id change" controller/lghs/maintenance.py
          grep -q "'reboot'" controller/lghs/protocol.py
          grep -q "systemd-run" student/lghs-command-executor
          grep -q "deployment_recovery_controls" controller/lghs-fleet-api
          grep -q "maintenance_windows" controller/lghs-fleet-api
          grep -q "scheduled_reboots" controller/lghs-fleet-api
          grep -q "Deployments / Updates" controller/lghs-console-day2
          grep -q "L Rollback" controller/lghs-console-day2
          grep -q 'ord("l"), ord("L")' controller/lghs-console-day2
          if grep -q "B Rollback" controller/lghs-console-day2; then
            echo 'Fleet Control rollback hotkey conflicts with the global Back key.' >&2
            exit 1
          fi
          grep -q "Rollback is planned only; it is never auto-dispatched from Fleet Control" controller/lghs-console-day2
          grep -q "ReadWritePaths=/var/lib/lghs /run/lock" systemd/lghs-rollout-manager.service
          grep -q 'controller/lghs/recovery.py' install.sh
          grep -q 'controller/lghs/maintenance.py' install.sh
          grep -q 'controller/lghs-fleet-maintenance' install.sh
          grep -q 'controller/lghs/recovery.py' updater/lghs-0.5-install
          grep -q 'controller/lghs/maintenance.py' updater/lghs-0.5-install
          grep -q 'controller/lghs-fleet-maintenance' updater/lghs-0.5-install
          if grep -nE 'shell=True|eval\(' controller/lghs/rollout.py controller/lghs/rollout_manager.py controller/lghs/recovery.py controller/lghs/maintenance.py controller/lghs-fleet-rollout controller/lghs-fleet-maintenance controller/lghs-rollout-manager student/lghs-command-executor; then
            echo 'Fleet operations contains an arbitrary shell path.' >&2
            exit 1
          fi
